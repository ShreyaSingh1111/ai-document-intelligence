<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Intelligence Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header><h1>Document Intelligence Dashboard</h1></header>

<div class="container">

  <div class="card">
    <h2>Upload Document</h2>
    <div class="upload-row">
      <select id="documentType">
        <option value="invoice">Invoice</option>
        <option value="balance_sheet">Balance Sheet</option>
        <option value="profit_loss">Profit &amp; Loss</option>
        <option value="cash_flow">Cash Flow Statement</option>
      </select>
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" />
      <button onclick="uploadDocument()">Upload &amp; Process</button>
    </div>
    <div id="uploadMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Processed Documents</h2>
    <table id="docTable">
      <thead>
        <tr><th>Name</th><th>Type</th><th>Status</th><th>Processed At</th></tr>
      </thead>
      <tbody id="docTableBody"></tbody>
    </table>
  </div>

  <div class="card" id="detailPanel">
    <button class="close-btn" onclick="closeDetail()">Close</button>
    <h2 id="detailTitle">Details</h2>

    <h3>Extracted Fields</h3>
    <div class="kv-grid" id="fieldsGrid"></div>

    <h3>Line Items</h3>
    <table id="lineItemsTable">
      <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead>
      <tbody id="lineItemsBody"></tbody>
    </table>

    <h3>Financial Validation</h3>
    <div id="validationChecks"></div>

    <h3>Raw JSON</h3>
    <pre id="rawJson"></pre>
  </div>

</div>

<script src="/static/js/app.js"></script>
</body>
</html>
